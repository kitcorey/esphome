[tools]
python = "3.15"
uv = "latest"
gitleaks = "latest"
hk = "1.45"
pkl = "0.31"
ruff = "latest"
shellcheck = "latest"
typos = "latest"
yamllint = "latest"

[env]
_.file = ".env"

[tasks.install-hooks]
description = "Point git at the versioned hooks directory (run once per clone)"
run = "git config core.hooksPath scripts/hooks"

[tasks.fleet-update]
description = "Compile and OTA-flash every ESPHome device behind the pinned version"
run = "uv run python3 .claude/skills/esphome-fleet-update/fleet_update.py"
raw = true # the Proceed and critical-device prompts need stdin

[tasks.clean]
description = "Run `esphome clean` on a specific device config"
run = "uv run esphome clean"

[tasks.clean-all]
description = "Run `esphome clean-all` (wipes shared caches too)"
run = "uv run esphome clean-all ."

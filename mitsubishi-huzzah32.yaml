substitutions:
  reboot_timeout: 1d
  name: 'heatpump'
  friendly_name: 'Heat Pump'
  static_ip: '192.168.20.83'

packages:
  wifi: !include common/wifi.yml
  sensor_wifi: !include common/sensor_wifi.yml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: featheresp32

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant
    id: homeassistant_time

# Adafruit HUZZAH32 Feather — CN105 wiring:
#   CN105 Pin 2 (GND)   -> Feather GND
#   CN105 Pin 3 (+5V)   -> Feather USB pin (powers board)
#   CN105 Pin 4 (HP TX) -> Feather RX (GPIO16)
#   CN105 Pin 5 (HP RX) -> Feather TX (GPIO17)
#   CN105 Pin 1 (+12V)  -> NOT CONNECTED

external_components:
  - source: github://muart-group/esphome-components@2026.3
    components: [mitsubishi_itp]

# CN105: 2400 baud, 8E1 (even parity). Try 9600 if 2400 doesn't work.
uart:
  - id: hp_uart
    baud_rate: 2400
    parity: EVEN
    rx_pin:
      number: GPIO16  # Feather silkscreen "RX"
    tx_pin:
      number: GPIO17  # Feather silkscreen "TX"

climate:
  - platform: mitsubishi_itp
    id: mitsubishi_hp
    name: "Climate"
    uart_heatpump: hp_uart
    update_interval: 5s
    supported_modes:
      - "OFF"
      - HEAT
      - DRY
      - COOL
      - FAN_ONLY
      - HEAT_COOL
    supported_fan_modes:
      - AUTO
      - QUIET
      - LOW
      - MEDIUM
      - HIGH

sensor:
  - platform: uptime
    name: ${name} Uptime
  - platform: mitsubishi_itp
    outdoor_temperature:
      name: "Outdoor Temperature"
    compressor_frequency:
      name: "Compressor Frequency"

binary_sensor:
  - platform: mitsubishi_itp
    defrost:
      name: "Defrost"
    filter_status:
      name: "Filter Status"
    preheat:
      name: "Preheat"
    standby:
      name: "Standby"

text_sensor:
  - platform: version
    name: ${name} ESPHome Version
  - platform: mitsubishi_itp
    actual_fan:
      name: "Actual Fan"
    error_code:
      name: "Error Code"

select:
  - platform: mitsubishi_itp
    temperature_source:
      name: "Temperature Source"

button:
  - platform: mitsubishi_itp
    filter_reset_button:
      name: "Filter Reset"

logger:
  level: DEBUG

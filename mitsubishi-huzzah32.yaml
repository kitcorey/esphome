substitutions:
  reboot_timeout: 1d
  name: 'heatpump'
  friendly_name: 'Heat Pump'
  static_ip: '192.168.20.83'

packages:
  wifi: !include common/wifi.yml
  sensor_wifi: !include common/sensor_wifi.yml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: featheresp32
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant
    id: homeassistant_time

# Adafruit HUZZAH32 Feather — CN105 wiring:
#   CN105 Pin 2 (GND)   -> Feather GND
#   CN105 Pin 3 (+5V)   -> Feather USB pin (powers board)
#   CN105 Pin 4 (HP TX) -> Feather RX (GPIO16)
#   CN105 Pin 5 (HP RX) -> Feather TX (GPIO17)
#   CN105 Pin 1 (+12V)  -> NOT CONNECTED

external_components:
  - source: github://echavet/MitsubishiCN105ESPHome

# CN105: 2400 baud, 8E1 (even parity, handled by cn105 component internally)
uart:
  id: HP_UART
  baud_rate: 2400
  rx_pin:
    number: GPIO16  # Feather silkscreen "RX"
  tx_pin:
    number: GPIO17  # Feather silkscreen "TX"

climate:
  - platform: cn105
    id: mitsubishi_hp
    name: "Climate"
    update_interval: 2s
    supports:
      mode: ["OFF", HEAT, DRY, COOL, FAN_ONLY, AUTO]
      fan_mode: [AUTO, QUIET, LOW, MEDIUM, HIGH]
    compressor_frequency_sensor:
      name: "Compressor Frequency"
    outside_air_temperature_sensor:
      name: "Outdoor Temperature"
    vertical_vane_select:
      name: "Vertical Vane"
    horizontal_vane_select:
      name: "Horizontal Vane"

sensor:
  - platform: uptime
    name: ${name} Uptime

text_sensor:
  - platform: version
    name: ${name} ESPHome Version

logger:
  level: DEBUG

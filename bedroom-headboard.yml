---
substitutions:
  reboot_timeout: 1d
  name: 'bedroom-headboard'
  friendly_name: 'Bedroom Headboard'
  static_ip: '192.168.20.99'
  sunrise_light_id: light_1
  # Intentionally low: ESP32-C3 LEDC trades frequency for bit-depth off the
  # 80 MHz APB clock, so >~5 kHz caps resolution at 12 bits (4096 steps) while
  # ~1 kHz allows the full 14 bits (16384 steps). The extra resolution matters
  # at the bottom of the sunrise fade (gamma 2.8 + ~0.5% brightness lives in
  # the lowest few duty-cycle steps); 1220 Hz is audible but no whine is
  # observed from this hardware.
  pwm_frequency: '1220Hz'

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

packages:
  wifi: !include common/wifi.yml
  sensor_wifi: !include common/sensor_wifi.yml
  sunrise: !include common/sunrise.yml

esphome:
  name: "${name}"
  platformio_options:
    board_build.flash_mode: dio

time:
  - platform: homeassistant
    id: homeassistant_time

logger:
  level: DEBUG
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

output:
  - platform: ledc
    pin: GPIO3
    frequency: ${pwm_frequency}
    id: pwm_r
  - platform: ledc
    pin: GPIO0
    frequency: ${pwm_frequency}
    id: pwm_g
  - platform: ledc
    pin: GPIO1
    frequency: ${pwm_frequency}
    id: pwm_b
  - platform: ledc
    pin: GPIO4
    frequency: ${pwm_frequency}
    id: pwm_ww
  - platform: ledc
    pin: GPIO5
    frequency: ${pwm_frequency}
    id: pwm_cw

light:
  - platform: rgbww
    id: light_1
    name: "${friendly_name}"
    red: pwm_r
    green: pwm_g
    blue: pwm_b
    cold_white: pwm_cw
    warm_white: pwm_ww
    warm_white_color_temperature: 2400 K
    cold_white_color_temperature: 6500 K

sensor:
  - platform: uptime
    name: "${name} Uptime Sensor"

  - platform: internal_temperature
    name: "${name} Internal Temperature"
    accuracy_decimals: 2
    update_interval: 30s

switch:
  - platform: restart
    name: ${name}-restart
    id: restart_switch

---
# Inspired by gabe565/esphome-configs (opengarage/) — same hardware family.
# https://github.com/gabe565/esphome-configs/tree/main/opengarage
# Borrowed: HA-tunable thresholds, status_led, current_operation OPENING/
# CLOSING transitions, delta-filtered distance, self-pulsing relay,
# play_rtttl service. Deliberately diverged: upper-quantile + delayed_on_off
# stack vs. wide-median-only; mandatory close warning (UL325) vs. toggle.
#
# OpenGarage v2.2 hardware (ESP-12 module, 4MB flash, no Security+).
# Pin map per OpenGarage hardware repo — use raw GPIO numbers, NOT D-notation
# (D5/D6 cause bootloop on this hardware revision).
substitutions:
  reboot_timeout: 1d
  name: 'garage-door'
  friendly_name: 'Garage Door'
  static_ip: '192.168.20.14'  # keep current OG IP to avoid HA / DNS churn
  board: esp12e
  open_delay: 22s    # rough wall-clock time for door to fully open
  close_delay: 15s   # ditto for close
  # Upper-quantile for the floor-visibility classifier (compile-time filter
  # arg, not runtime-templatable).
  distance_quantile: '0.8'

packages:
  s31_base: !include common/s31_base.yml
  wifi: !include common/wifi.yml
  sensor_wifi: !include common/sensor_wifi.yml
  garage_roam: !include common/garage_wifi_roam.yml

# Merges with common/s31_base.yml — sets the device's friendly_name so
# entities with `name: None` (e.g. the main cover below) collapse to just
# the device name in HA instead of "Device Device".
esphome:
  friendly_name: '${friendly_name}'

# Merges with common/s31_base.yml (board: from there) to enable persistence
# for the HA-tunable number entities below.
esp8266:
  restore_from_flash: true

# Merges with common/s31_base.yml (encryption etc. from there) — exposes
# an HA service to play an arbitrary RTTTL string through the buzzer.
api:
  services:
    - service: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'

# Onboard ESP-12 LED — ESPHome core status indicator (WiFi/API health).
status_led:
  pin:
    number: GPIO2
    inverted: true

# HA-tunable thresholds (persisted via restore_from_flash above).
# Stored in cm for readability in the HA UI; lambdas divide by 100 to get
# meters to match the ultrasonic sensor's internal units.
number:
  - platform: template
    name: 'Door Threshold'
    id: door_threshold_cm
    min_value: 10
    max_value: 300
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 50
    entity_category: config
    mode: box
    unit_of_measurement: cm
    icon: mdi:garage

  - platform: template
    name: 'Relay Click Time'
    id: relay_click_time_ms
    min_value: 100
    max_value: 2000
    step: 10
    optimistic: true
    restore_value: true
    initial_value: 1000
    entity_category: config
    mode: box
    unit_of_measurement: ms
    icon: mdi:timer

# HC-SR04 ultrasonic — drives door (open/closed) state.
# State derivation stacks an upper-quantile floor-visibility classifier
# (sample-level) with delayed_on/off (state-level debounce). See the filter
# comment below for the why; the short version is that a low obstruction adds
# spurious NEAR returns but can't fake a FAR (floor) one, so we classify on
# whether the floor is still reachable rather than on a median of the clutter.
sensor:
  - platform: ultrasonic
    trigger_pin: GPIO12
    echo_pin: GPIO14
    id: door_distance
    name: 'Distance'
    # update_interval was 500ms (OG dri). A bad obstruction scatters the beam
    # so ~70–90 % of pings time out (NaN); pinging fast packs more floor
    # glimpses into the quantile window, which is what actually killed the
    # flapping (echo-loss gap 55–68 s → ~8 s, measured 2026-05-28). The
    # HC-SR04 cycle floors ~170 ms on this ESP8266, so 100ms self-limits to
    # ~6 reads/s — that's fine, it just runs as fast as it can. Keep ≥60 ms
    # (sensor inter-ping min).
    update_interval: 100ms
    timeout: 4.0m
    filters:
      # Upper-quantile floor-visibility classifier (replaces the old median).
      #
      # Key insight: a low object/person partly in the sensor cone can only
      # ADD spurious NEAR readings — it can't manufacture a FAR one. The floor
      # (~2.6 m) stays intermittently visible past a partial obstruction. A
      # real OPEN drops the panel under the sensor and physically blocks the
      # floor (no far return possible); a parked car roof (~1 m) likewise
      # blocks it. So a median is the wrong statistic — clutter that occupies
      # the bottom of the distribution drags the median down and flaps state.
      # Instead we ask "is the floor still reachable past the clutter?" by
      # taking an UPPER quantile: clutter sits low and is ignored, and only a
      # sustained loss of far returns (real open / car) moves state.
      #
      # With q=0.8 the published value is ~the 80th-percentile reading (NaN
      # timeouts are dropped before the percentile is taken), so ~80 % of the
      # window's VALID readings must be near before it reports near. As long as
      # the floor shows up in ≳20 % of valid samples, the value stays far and
      # door_closed holds. A real open (floor fully blocked) and a car roof
      # still register. window_size 60 ≈ 6 s at the nominal 100 ms ping (≈10 s
      # at the ~170 ms actually achieved) — wide enough to hold ~15+ valid
      # readings even at a 70–90 % timeout rate.
      #
      # delta: drops readings <1 cm from the last published value, cutting
      # idle chatter to HA (HA-chatter gate only). Lambdas read .state (the
      # last published value), but the threshold is coarse enough (50 cm)
      # that the dead-zone doesn't matter for on-device state evaluation.
      #
      # History: median (7→15) → quantile (window 21, 500 ms) → this. An object
      # under the sensor flapped door_closed every 10–40 s under the median; the
      # quantile alone (at 500 ms) only cut it to ~1 flap/min because the beam
      # scatter timed out ~92 % of pings, leaving ~1.7 valid samples per window.
      # Dropping to 100 ms pings (≈3× the reads, ~8 s worst echo-loss gap) is
      # what fixed it: ~46 min clean with the object in place (live 2026-05-28).
      #
      # If false positives reappear, tune in this order (slower but stronger):
      #   1. Raise quantile toward 0.9 to tolerate more spurious-far noise, or
      #      lower toward 0.7 for faster real-open detection (0.5 ≡ old median).
      #   2. Widen window_size — longer window, more valid samples to confirm,
      #      but lags real transitions by more samples (~170 ms each).
      #   3. Lengthen delayed_on_off on door_closed below — each added second
      #      is a second of HA-visible lag, but requires sustained
      #      classification before flipping state.
      # Scale value + state layers together rather than maxing one.
      #
      # NOTE: ultrasonic alone can't distinguish a person/object standing
      # perfectly still directly under the sensor (sustained full occlusion,
      # all returns < 0.5 m) from a closed panel. A rail reed/tilt switch is the
      # durable fix if that ever bites.
      - quantile:
          window_size: 60          # ~6 s @100 ms nominal, ~10 s @~170 ms actual
          quantile: ${distance_quantile}
          send_every: 1
      # Cold-boot guard: suppress publishes until the quantile window has filled.
      # On boot the window starts empty, so the first 1–2 readings (easily a
      # stray near return with an object present) would otherwise publish a
      # bogus low distance and flap door_closed to "open" for a few seconds. Until
      # ~window_size readings arrive, door_distance.state stays NaN → door_closed's
      # lambda returns {} (HA shows unavailable, not a false "open").
      # Costs ~10 s of "unknown" after each reboot/OTA — reboots are rare.
      - skip_initial: 60
      - delta: 0.01

binary_sensor:
  # Door closed: distance >= door_threshold_cm (default 50, OG dth=50).
  # Below that, the ceiling-mounted sensor sees the door panel raised under
  # it → door is open. Threshold is HA-tunable via number.door_threshold_cm.
  - platform: template
    id: door_closed
    name: 'Closed'
    device_class: garage_door
    lambda: |-
      if (isnan(id(door_distance).state)) return {};
      return id(door_distance).state >= id(door_threshold_cm).state / 100.0f;
    filters:
      # Require state to hold 10 s before flipping EITHER way. MUST be the
      # single delayed_on_off filter, NOT stacked delayed_on + delayed_off:
      # chaining them is a footgun here. delayed_on passes a falling edge
      # through immediately but holds the rising edge for 10 s, so a brief
      # sub-threshold spike in the quantile output (the floor momentarily lost
      # to a clutter burst) reaches delayed_off as a 0 and schedules an OFF,
      # while the recovery is still stuck in delayed_on and can't cancel it —
      # manufacturing a ~10 s "open" pulse from a <2 s dip. (Diagnosed live
      # 2026-05-28: a 1.5 s and a 0.13 s dip produced exactly-10 s-delayed OFF
      # pulses in HA.) delayed_on_off arms one timer and re-arms it on each
      # edge, so a dip that recovers inside 10 s cancels its own pending OFF.
      # A real open (floor blocked, sustained) still registers in ~20–25 s.
      - delayed_on_off: 10s

  # Case-mounted button on GPIO0 — manual cycle.
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: 'Button'
    on_press:
      then:
        - cover.toggle: garage_door
    filters:
      - delayed_on: 50ms

# Relay (GPIO15) — momentary pulse to fire the opener's button input.
# Self-pulsing: on_turn_on schedules its own turn_off after relay_click_time_ms,
# so callers just `switch.turn_on` and forget. Internal: only the cover and
# warn_then_close should drive it.
switch:
  - platform: gpio
    pin: GPIO15
    id: garage_relay
    restore_mode: ALWAYS_OFF
    internal: true
    on_turn_on:
      - delay: !lambda "return (uint32_t) id(relay_click_time_ms).state;"
      - switch.turn_off: garage_relay

# Template cover wrapping ultrasonic (state) + relay (action).
# Close is gated by a 5 s warning beep — replicates OG alm=1+aoo=1
# (UL325-style safety: warn anyone in the bay before remote close).
# Open and stop fire immediately (no warning needed; opening can't pinch).
# open_action/close_action publish current_operation so HA shows the
# transient OPENING/CLOSING state, then IDLE once the door should be settled.
cover:
  - platform: template
    name: None
    id: garage_door
    device_class: garage
    has_position: false
    assumed_state: false
    lambda: |-
      if (id(door_closed).state) return COVER_CLOSED;
      return COVER_OPEN;
    open_action:
      - cover.template.publish:
          id: garage_door
          current_operation: OPENING
      - switch.turn_on: garage_relay
      - delay: ${open_delay}
      - cover.template.publish:
          id: garage_door
          current_operation: IDLE
    stop_action:
      - switch.turn_on: garage_relay
      - cover.template.publish:
          id: garage_door
          current_operation: IDLE
    close_action:
      - if:
          # Skip warning if door's already closed — relay would do nothing.
          condition:
            binary_sensor.is_off: door_closed
          then:
            - cover.template.publish:
                id: garage_door
                current_operation: CLOSING
            - script.execute: warn_then_close
            - script.wait: warn_then_close
            - delay: ${close_delay}
            - cover.template.publish:
                id: garage_door
                current_operation: IDLE

# Buzzer (GPIO13) and warning script.
output:
  - platform: esp8266_pwm
    pin: GPIO13
    id: buzzer_pwm

rtttl:
  id: buzzer
  output: buzzer_pwm

script:
  - id: warn_then_close
    mode: single   # ignore re-triggers while already running
    then:
      # ~5 s warning: 5 short beeps interleaved with rests.
      # b=120 → quarter (d=4) = 0.5 s; 11 notes × 0.5 s = ~5.5 s.
      # Tunable — match OG's 5 s alarm window. Pitch c5 = 523 Hz, audible.
      - rtttl.play: 'warn:d=4,o=5,b=120:c,p,c,p,c,p,c,p,c,p,c'
      - wait_until:
          not:
            rtttl.is_playing:
      - switch.turn_on: garage_relay

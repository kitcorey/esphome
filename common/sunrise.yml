# Reusable sunrise wake-up effect for RGBWW lights.
#
# Required substitutions in the device file:
#   sunrise_light_id   — id of the rgbww light to drive. Must be a bare
#                        C++ identifier matching the light's `id:`
#                        (e.g. light_1), not a quoted string — it is
#                        textually substituted into id(...) in lambdas.
#
# Trigger from HA via the actions registered below. Action names are
# prefixed with the device's `esphome: name:` (underscored), e.g. for a
# device named `bedroom-headboard`:
#
#   service: esphome.bedroom_headboard_start_sunrise
#   data:
#     duration_s: 1800        # 30 min fade; defaults to 1800 if 0/missing
#
#   service: esphome.bedroom_headboard_stop_sunrise
#
# A 2 s interval ticks while sunrise_active is true, recomputing
# brightness and color. Logic lives outside the light block so the
# device file can keep its plain rgbww light definition.

globals:
  - id: sunrise_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: sunrise_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: sunrise_duration_s
    type: uint32_t
    restore_value: false
    initial_value: '1800'

script:
  - id: start_sunrise
    mode: restart
    parameters:
      duration_s: int
    then:
      - lambda: |-
          id(sunrise_start_ms) = millis();
          id(sunrise_duration_s) = duration_s > 0 ? (uint32_t) duration_s : 1800;
          id(sunrise_active) = true;
  - id: stop_sunrise
    then:
      - lambda: 'id(sunrise_active) = false;'
      - light.turn_off:
          id: ${sunrise_light_id}
          transition_length: 5s

# Parametrized scripts are not auto-exposed to HA — this block is
# what registers the `start_sunrise` / `stop_sunrise` actions.
api:
  actions:
    - action: start_sunrise
      variables:
        duration_s: int
      then:
        - script.execute:
            id: start_sunrise
            duration_s: !lambda 'return duration_s;'
    - action: stop_sunrise
      then:
        - script.execute: stop_sunrise

interval:
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return id(sunrise_active);'
          then:
            - lambda: |-
                const float T = (float) id(sunrise_duration_s);
                float t = (millis() - id(sunrise_start_ms)) / 1000.0f;
                float p = t / T;
                if (p < 0.f) p = 0.f;
                if (p > 1.f) p = 1.f;

                // Quadratic brightness — gentle start, peak at p=1.
                float bri = p * p;
                if (bri < 0.005f) bri = 0.005f;

                // Three-phase color path:
                //   0.00–0.30  deep red → red-orange  (RGB amber + warm white)
                //   0.30–0.65  orange → amber          (RGB amber + warm white)
                //   0.65–1.00  hold RGB at peak amber, ramp cold_white in on top,
                //              CCT report shifts 2400→3500 K
                //
                // Warm-white runs at 100% throughout; the master brightness
                // (set_brightness) controls its output level, so phases 1-2
                // already get most of their visible light from the warm-white
                // LED with the RGB channels tinting it. Phase 3 keeps the RGB
                // amber at full and ramps cold_white in on top for added
                // brightness at the peak; the reported CCT shifts from 2400 K
                // toward ~3500 K (HA reports rgbww color_mode while RGB is on,
                // so the CCT value is informational).
                //
                // Avoid set_white on rgbww — it overwrites brightness with the
                // white value (light_call.cpp:417). Drive cold/warm white
                // directly instead.
                float r = 1.0f, g = 0.12f, b = 0.0f;
                float color_bri = 1.0f, ww = 1.0f, cw = 0.0f;
                float kelvin = 2400.0f;
                if (p < 0.30f) {
                  float k = p / 0.30f;
                  g = 0.12f + 0.30f * k;
                } else if (p < 0.65f) {
                  float k = (p - 0.30f) / 0.35f;
                  g = 0.42f + 0.40f * k;
                  b = 0.05f * k;
                } else {
                  // Clamp: float division of (1.0-0.65)/0.35 lands at 1.0000005,
                  // pushing cw above 1.0 and color_bri below 0 at the final tick.
                  float k = (p - 0.65f) / 0.35f;
                  if (k > 1.f) k = 1.f;
                  // Hold RGB at end-of-phase-2 amber; cold_white ramps in on top to add brightness.
                  g = 0.82f;
                  b = 0.05f;
                  color_bri = 1.0f;
                  // Cold-white to full alongside warm-white lands near 3500 K.
                  cw = k;
                  kelvin = 2400.0f + 1100.0f * k;
                }

                auto call = id(${sunrise_light_id}).turn_on();
                call.set_transition_length(2000);
                call.set_brightness(bri);
                call.set_color_brightness(color_bri);
                call.set_red(r);
                call.set_green(g);
                call.set_blue(b);
                call.set_cold_white(cw);
                call.set_warm_white(ww);
                call.set_color_temperature(1000000.0f / kelvin);  // mireds, for HA state reporting
                call.perform();

                if (p >= 1.0f) {
                  id(sunrise_active) = false;
                }
